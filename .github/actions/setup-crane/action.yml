name: Setup crane
description: Install the crane CLI (go-containerregistry) into /usr/local/bin.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        case "$(uname -m)" in
          x86_64) arch=x86_64 ;;
          aarch64 | arm64) arch=arm64 ;;
          *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
        esac
        curl -fsSL "https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_${arch}.tar.gz" \
          | sudo tar -xzf - -C /usr/local/bin crane
        crane version
