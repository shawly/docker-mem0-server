name: mirror

# Mirrors the mem0 self-hosted server + dashboard as container images.
#
#   - edge      : built from the upstream default branch, on every relevant change
#   - vX.Y.Z    : the newest release that changed the component (also tagged
#                 latest, vX, vX.Y) — older releases are not backfilled
#
# The repo is public, so Actions minutes are free — the schedule simply polls
# upstream and the registry, and only builds when something actually changed
# (source) or a base image was patched (digest drift). See .github/scripts.

on:
  pull_request:
    paths:                 # validate that changes still build (never pushes)
      - "dockerfiles/**"
      - ".github/actions/**"
      - ".github/scripts/**"
      - ".github/workflows/mirror.yml"
  push:
    branches: [main]
    paths:
      - "dockerfiles/**"   # we maintain the Dockerfiles; rebuild when they change
  schedule:
    - cron: "17 4 * * *"   # daily; upstream releases are infrequent
  workflow_dispatch:

concurrency:
  # Serialize publishing runs (shared main ref); give each PR its own group.
  group: mirror-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
  UPSTREAM: mem0ai/mem0

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.plan.outputs.builds }}
      merges: ${{ steps.plan.outputs.merges }}
      has_builds: ${{ steps.plan.outputs.has_builds }}
    steps:
      - name: Checkout build tooling
        uses: actions/checkout@v6

      - name: Checkout upstream (full history + tags)
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM }}
          path: upstream
          fetch-depth: 0
          fetch-tags: true

      - name: Set up crane
        uses: ./.github/actions/setup-crane

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Plan builds
        id: plan
        working-directory: upstream
        env:
          REGISTRY: ${{ env.REGISTRY }}
          OWNER: ${{ env.OWNER }}
        run: python3 "${GITHUB_WORKSPACE}/.github/scripts/discover.py"

  # One per-arch build per image, each on its native runner (no QEMU). Images
  # are pushed by digest (untagged); the merge job assembles the manifest list.
  build:
    needs: discover
    if: ${{ needs.discover.outputs.has_builds == 'true' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJson(needs.discover.outputs.builds) }}
    name: ${{ matrix.title }}:${{ matrix.version }} (${{ matrix.arch }})
    steps:
      - name: Checkout build tooling
        uses: actions/checkout@v6

      - name: Checkout upstream @ ${{ matrix.ref }}
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ matrix.ref }}
          path: upstream

      - name: Set up crane
        uses: ./.github/actions/setup-crane

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve build metadata
        id: bases
        run: |
          all="$(python3 .github/scripts/bases.py "${{ matrix.dockerfile }}")"
          primary="${all##*,}"
          {
            echo "all=${all}"
            echo "name=${primary%@*}"
            echo "digest=${primary##*@}"
            echo "dockerfile=sha256:$(sha256sum "${{ matrix.dockerfile }}" | cut -d' ' -f1)"
          } >>"$GITHUB_OUTPUT"
          echo "Bases: ${all}"

      - name: Build${{ github.event_name == 'pull_request' && ' (no push, PR validation)' || ' and push by digest' }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: upstream/${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          # push only on non-PR events; PRs build to validate but never publish
          outputs: type=image,name=${{ matrix.image }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=${{ matrix.key }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.key }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=Unofficial mem0 ${{ matrix.component }} image (built from ${{ env.UPSTREAM }})
            org.opencontainers.image.source=https://github.com/${{ env.UPSTREAM }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ matrix.revision }}
            org.opencontainers.image.version=${{ matrix.version }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.base.name=${{ steps.bases.outputs.name }}
            org.opencontainers.image.base.digest=${{ steps.bases.outputs.digest }}
            mirror.base.digests=${{ steps.bases.outputs.all }}
            mirror.dockerfile.digest=${{ steps.bases.outputs.dockerfile }}

      - name: Export digest
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.key }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Assemble the per-arch digests of each image into one tagged manifest list.
  # Publishing only — skipped entirely on pull requests.
  merge:
    needs: [discover, build]
    if: ${{ needs.discover.outputs.has_builds == 'true' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.merges) }}
    name: ${{ matrix.title }}:${{ matrix.version }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.key }}-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest list
        working-directory: /tmp/digests
        run: |
          tags=""; for t in ${TAGS//,/ }; do tags="$tags -t $t"; done
          sources=""; for d in *; do sources="$sources ${IMAGE}@sha256:$d"; done
          docker buildx imagetools create $tags $sources
        env:
          TAGS: ${{ matrix.tags }}
          IMAGE: ${{ matrix.image }}

      - name: Inspect
        run: docker buildx imagetools inspect "${{ matrix.image }}:${{ matrix.version }}"
